name: Build AAPS 4.0.0 (Medtrum notification dedupe)

on:
  push:
    branches: [master, 'feature/aaps4-medtrum-notification-dedupe']
    paths:
      - '.github/workflows/build-aaps-4.yml'
      - '.github/patches/aaps4-medtrum-notification-dedupe.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repository to access the Medtrum patch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout verified official AndroidAPS 4.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 4.0.0 https://github.com/nightscout/AndroidAPS.git source
          test "$(git -C source rev-parse HEAD)" = "f77abd9b82b308e8fc330da0d7a31370fb4a0f49"

      - name: Apply verified Medtrum notification de-duplication patch
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git apply --check ../.github/patches/aaps4-medtrum-notification-dedupe.patch
          git apply ../.github/patches/aaps4-medtrum-notification-dedupe.patch
          echo "Medtrum patch applied; critical pump alarms and Objectives remain unchanged."

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and sign phone and watch release APKs
        shell: bash
        env:
          S_KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$S_KEYSTORE_SET" ]]; then
            decoded="$(printf '%s' "$S_KEYSTORE_SET" | base64 --decode)"
            IFS='|' read -r ks_base64 ks_password ks_alias key_password <<< "$decoded"
          else
            ks_base64="$S_KEYSTORE_BASE64"
            ks_password="$S_KEYSTORE_PASSWORD"
            ks_alias="$S_KEY_ALIAS"
            key_password="$S_KEY_PASSWORD"
          fi

          for field in ks_base64 ks_password ks_alias key_password; do
            if [[ -z "${!field}" ]]; then
              echo "Missing signing credential: $field" >&2
              exit 1
            fi
          done
          echo "::add-mask::$ks_password"
          echo "::add-mask::$ks_alias"
          echo "::add-mask::$key_password"
          signing_file="$RUNNER_TEMP/aaps-signing.jks"
          printf '%s' "$ks_base64" | base64 --decode > "$signing_file"
          chmod 600 "$signing_file"
          keytool -list -keystore "$signing_file" -storepass "$ks_password" -alias "$ks_alias" >/dev/null

          cd source
          chmod +x ./gradlew
          ./gradlew :app:assembleFullRelease :wear:assembleFullRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss4m" \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.workers.max=4 \
            -Pandroid.injected.signing.store.file="$signing_file" \
            -Pandroid.injected.signing.store.password="$ks_password" \
            -Pandroid.injected.signing.key.alias="$ks_alias" \
            -Pandroid.injected.signing.key.password="$key_password"

      - name: Validate and package APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp source/app/build/outputs/apk/full/release/*.apk artifacts/aaps-4.0.0-medtrum-dedupe-full-release.apk
          cp source/wear/build/outputs/apk/full/release/*.apk artifacts/aaps-wear-4.0.0-medtrum-dedupe-full-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose artifacts/aaps-4.0.0-medtrum-dedupe-full-release.apk
          "$apksigner" verify --verbose artifacts/aaps-wear-4.0.0-medtrum-dedupe-full-release.apk
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish downloadable APKs
        uses: actions/upload-artifact@v4
        with:
          name: aaps-4.0.0-medtrum-dedupe-signed-phone-watch
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error
